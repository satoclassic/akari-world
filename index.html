<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>灯街 3D β</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1524;color:#f8f1e6;font:15px/1.5 system-ui,-apple-system,sans-serif}header{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:#161d30}h1{font-size:20px;margin:0;color:#ffda9a}#stage{height:min(66vh,650px);position:relative;background:linear-gradient(#605681,#e0a078);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hint{position:absolute;top:12px;left:12px;background:#111a2bcc;padding:8px 12px;border-radius:12px;pointer-events:none}#joystick{position:absolute;bottom:15px;left:15px;width:110px;height:110px;border:2px solid #ffffff88;border-radius:50%;background:#18233888;touch-action:none}#stick{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#fbd3a6bb;pointer-events:none}#interact{position:absolute;bottom:18px;right:18px}button{background:#58496e;border:1px solid #9d8bad;color:white;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffd17e}.panel{max-width:980px;margin:12px auto;padding:14px;background:#1c253b;border-radius:14px}#conversation{display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;padding:12px;border:1px solid #677491;border-radius:9px;background:#0c1425;color:white;font:inherit}#history{max-height:170px;overflow:auto;white-space:pre-wrap;line-height:1.7;color:#f3e5d6}#choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}small,.muted{color:#b6c1d4}#status{font-size:13px;color:#e8d0a9}footer{max-width:980px;margin:10px auto;padding:12px;color:#b7bfd0;font-size:12px}#near{color:#ffdf9d}@media(min-width:900px){#stage{height:65vh}}@media(max-width:600px){#hint{font-size:12px;max-width:75%}#stage{height:53vh}#joystick{width:95px;height:95px}#stick{left:27px;top:27px}}</style></head><body><header><h1>🏮 灯街 <small>3D β</small></h1><small id="day">1日目・夕方</small></header><section id="stage"><div id="hint">画面をドラッグ：視点　左下：移動<br>住人に近づいて「話す」を押してね</div><div id="joystick"><div id="stick"></div></div><button id="interact">💬 話す</button></section><div class="panel"><div><b id="near">住人を探してみよう</b> <span id="relationship"></span></div><div id="history" aria-live="polite">夕暮れの灯街にやってきた。6人の住人がそれぞれの場所で暮らしている。</div><div id="conversation"><input id="message" maxlength="200" placeholder="住人に話しかける言葉（文字入力）" aria-label="会話入力"><button id="send">送信</button></div><div id="choices"><button id="mic">🎙️ マイク</button><button id="voice">🔊 読み上げ ON</button><button id="next">🌙 翌日</button><button id="save">💾 保存</button></div><p id="status">3Dの街はブラウザ内で描画します。音声認識は対応ブラウザのみ利用できます。</p></div><footer>安全なローカル体験版。会話は簡易応答（本物の生成AIではありません）。会話内容・関係・日付はこの端末に保存。マイク音声認識はブラウザ提供元のサービスに送信される場合があります。外部AI APIキーは埋め込んでいません。共有世界は未実装です。</footer><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";(()=>{'use strict';const $=x=>document.getElementById(x),names=['ミオ','レン','ユナ','カイ','アオイ','ハル'],jobs=['花屋','古書店','カフェ','音楽家','図書館','街の案内人'],traits=['朗らかで秘密がある','静かで誠実','元気で負けず嫌い','自由で情熱的','思慮深い','誰とでも仲良くなる'];let state;try{state=JSON.parse(localStorage.getItem('akari-beta3d'))}catch(e){}if(!state||!Array.isArray(state.bonds)||state.bonds.length!==6)state={day:1,bonds:[0,0,0,0,0,0],memories:[[],[],[],[],[],[]],muted:false,position:[0,6],stories:[]};const save=()=>{try{localStorage.setItem('akari-beta3d',JSON.stringify(state))}catch(e){}};let selected=-1,near=-1,turn=0,keys={},joy={x:0,y:0},yaw=0,drag=null,world,renderer,camera,player,people=[],last=performance.now();const append=t=>{const d=$('history');d.textContent+='\n'+t;d.scrollTop=d.scrollHeight};function speak(t){if(state.muted||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.04;u.pitch=selected%2?0.95:1.12;window.speechSynthesis.speak(u)}function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.85})}function box(w,h,d,color,x,y,z,parent=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);parent.add(m);return m}function sphere(r,c,x,y,z,parent=world){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat(c));m.position.set(x,y,z);parent.add(m);return m}function init(){if(!window.THREE){$('status').textContent='3Dライブラリを読み込めません。通信環境を確認して再読み込みしてください。';return}world=new THREE.Scene();world.background=new THREE.Color('#c58f8e');world.fog=new THREE.Fog('#c58f8e',35,85);camera=new THREE.PerspectiveCamera(66,1,.1,150);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));$('stage').prepend(renderer.domElement);world.add(new THREE.HemisphereLight('#ffe2ba','#586174',2));const sun=new THREE.DirectionalLight('#ffe0a6',2.2);sun.position.set(-12,25,-18);world.add(sun);box(80,.2,80,'#526c62',0,-.15,0);box(9,.05,70,'#776c72',0,.01,0);for(let z=-31;z<32;z+=8){box(.12,.02,3,'#d9bda2',0,.045,z)}const colors=['#a96c77','#647a8e','#9d846e','#89798d','#8a9d8c','#a48d75'];for(let i=0;i<12;i++){const side=i%2?-1:1,z=Math.floor(i/2)*10-26,x=side*10;const height=5+(i%3);box(8,height,8,colors[i%6],x,height/2,z);box(9,.5,9,'#4c4559',x,height+.2,z);for(let j=-1;j<=1;j++)box(1.2,1.6,.12,'#ffe3aa',x+j*2,2.5,z+4.07);box(1.7,2.8,.15,'#493e48',x,1.4,z+4.1);if(i%3===0){box(1.2,.3,1.2,'#ffe7a1',side*5,3,z);box(.13,3,.13,'#474357',side*5,1.5,z)}}for(let i=0;i<20;i++){const z=(i*7)%65-32,x=(i%2?1:-1)*17;box(.4,2,.4,'#625348',x,1,z);sphere(1.5,'#4d7763',x,3,z)}player=new THREE.Group();box(.65,1.05,.4,'#f5c48d',0,1.2,0,player);sphere(.32,'#f3cfb5',0,2,0,player);box(.28,.7,.3,'#323a55',-.2,.4,0,player);box(.28,.7,.3,'#323a55',.2,.4,0,player);player.position.set(...[state.position[0],0,state.position[1]]);world.add(player);const places=[[-2,-8],[2,-18],[-2,4],[2,13],[-2,23],[2,30]],outfits=['#a44f72','#4c759a','#e6a254','#648f7d','#9272aa','#9b685d'];places.forEach(([x,z],i)=>{const g=new THREE.Group();box(.85,1.3,.5,outfits[i],0,1.05,0,g);sphere(.38,'#f1c5a6',0,2,0,g);sphere(.42,i%2?'#4b3d4b':'#6b4c40',0,2.25,-.06,g);box(.3,.75,.3,'#3e3d57',-.2,.38,0,g);box(.3,.75,.3,'#3e3d57',.2,.38,0,g);g.position.set(x,0,z);world.add(g);people.push(g)});function resize(){const el=$('stage');renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();requestAnimationFrame(frame)}function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(renderer){const f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0)-joy.y,r=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x;const len=Math.max(1,Math.hypot(f,r));const dx=(Math.sin(yaw)*f+Math.cos(yaw)*r)/len,dz=(-Math.cos(yaw)*f+Math.sin(yaw)*r)/len;player.position.x=Math.max(-4,Math.min(4,player.position.x+dx*dt*5));player.position.z=Math.max(-33,Math.min(33,player.position.z+dz*dt*5));if(Math.abs(f)+Math.abs(r)>.01)player.rotation.y=Math.atan2(dx,-dz);camera.position.set(player.position.x+Math.sin(yaw)*8,5.5,player.position.z+Math.cos(yaw)*8);camera.lookAt(player.position.x,1.35,player.position.z-2);near=-1;let dist=3.2;people.forEach((p,i)=>{p.rotation.y=Math.sin(now*.0005+i)*.25;const d=p.position.distanceTo(player.position);if(d<dist){dist=d;near=i}});$('near').textContent=near<0?'住人に近づこう':'近くにいる：'+names[near];$('relationship').textContent=near<0?'':'親密度 '+state.bonds[near]+'/10';state.position=[+player.position.x.toFixed(2),+player.position.z.toFixed(2)];renderer.render(world,camera)}requestAnimationFrame(frame)}function talk(){if(near<0){append('もう少し住人に近づいてみよう。');return}selected=near;append(names[selected]+'：こんにちは。今日は何を話そうか？');speak('こんにちは。今日は何を話そうか？')}function respond(t){if(selected<0){talk();if(selected<0)return}const i=selected,old=state.memories[i]||[];let answer;if(/好き|恋人|付き合|愛して/.test(t))answer=state.bonds[i]>=3?'私もあなたともっと一緒にいたい。これからも会いに来てね。':'うれしい。でも、もう少しあなたのことを知りたいな。';else if(/名前|仕事|何して/.test(t))answer='私は'+names[i]+'。'+jobs[i]+'に関わっているよ。'+traits[i]+'って言われるんだ。';else if(/覚えて|前に|昨日/.test(t))answer=old.length?'覚えてるよ。前に「'+old[old.length-1].slice(0,35)+'」って話してくれたよね。':'まだ思い出が少ないね。これから増やそう。';else if(/こんにちは|元気|おはよう/.test(t))answer='元気だよ。会いに来てくれてうれしい。';else answer=['なるほど、そう思ったんだね。もう少し聞かせて。','ふふ、一緒に話していると楽しいね。','その話、覚えておくね。また聞かせてほしいな。'][(state.day+i+turn++)%3];old.push(t);state.memories[i]=old.slice(-15);state.bonds[i]=Math.min(10,state.bonds[i]+1);append('あなた：'+t+'\n'+names[i]+'：'+answer);speak(answer);save()}$('interact').onclick=talk;$('send').onclick=()=>{const t=$('message').value.trim();if(t){respond(t);$('message').value=''}};$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('save').onclick=()=>{save();$('status').textContent='この端末に保存しました。'};$('voice').onclick=()=>{state.muted=!state.muted;$('voice').textContent=state.muted?'🔇 読み上げ OFF':'🔊 読み上げ ON';if(state.muted&&window.speechSynthesis)window.speechSynthesis.cancel();save()};$('next').onclick=()=>{state.day++;const a=(state.day*3)%6,b=(state.day*5+1)%6;const story=names[a]+'と'+names[b]+'が広場で一緒に過ごしていたらしい。';state.stories.push(story);state.stories=state.stories.slice(-20);$('day').textContent=state.day+'日目・夕方';append('街のうわさ：'+story);save()};$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='このブラウザは音声認識に非対応です。iPhoneではキーボードのマイクを使ってみてね。';return}const r=new R();r.lang='ja-J';r.interimResults=false;r.onstart=()=>$('status').textContent='聞いているよ……';r.onresult=e=>respond(e.results[0][0].transcript);r.onerror=e=>$('status').textContent='音声認識エラー：'+e.error;r.start()};window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);const j=$('joystick'),stick=$('stick');function move(e){const b=j.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),len=Math.max(1,Math.hypot(x,y)),scale=Math.min(1,len/35);joy.x=x/len*scale;joy.y=-y/len*scale;stick.style.transform='translate('+(joy.x*30)+'px,'+(-joy.y*30)+'px)'}j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);move(e)});j.addEventListener('pointermove',e=>{if(j.hasPointerCapture(e.pointerId))move(e)});const stop=()=>{joy={x:0,y:0};stick.style.transform=''};j.addEventListener('pointerup',stop);j.addEventListener('pointercancel',stop);$('stage').addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS')drag={x:e.clientX,y:e.clientY}});$('stage').addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-drag.x)*.005;drag={x:e.clientX,y:e.clientY}}});window.addEventListener('pointerup',()=>drag=null);$('day').textContent=state.day+'日目・夕方';$('voice').textContent=state.muted?'🔇 読み上げ OFF':'🔊 読み上げ ON';init()})();</script></body></html>
