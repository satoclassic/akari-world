<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>灯街｜歩いて、出会って、話す</title><style>*{box-sizing:border-box}body{margin:0;background:#10172d;color:#fff4e9;font-family:system-ui,-apple-system,sans-serif}header{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:#161b32}h1{font-size:22px;margin:0;color:#ffd18e}small,.hint{color:#c3c6d4}main{max-width:1080px;margin:auto;padding:12px}.scene{position:relative;border:3px solid #343d61;border-radius:18px;overflow:hidden;box-shadow:0 14px 45px #0007}.scene svg{width:100%;height:auto;display:block}.person{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center bottom;transition:filter .2s}.person:hover,.person:focus{filter:drop-shadow(0 0 12px #fff5a2)}.person.active{filter:drop-shadow(0 0 16px #fff0a2)}.person .body{transition:transform .2s}.person:hover .body{transform:translateY(-5px)}.bubble{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);width:min(95%,720px);background:#1a1e36ee;border:1px solid #74738e;border-radius:16px;padding:14px;box-shadow:0 6px 20px #0009}.bubble strong{color:#ffd18e}.bubble p{margin:6px 0 0;min-height:44px}button{background:#3a385c;color:#fff;border:1px solid #817b9b;border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer}button:hover{background:#5a4a76}button:focus-visible{outline:3px solid #ffd18e}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.toolbar button{flex:1;min-width:130px}.dialog{background:#1e263e;border:1px solid #48536d;border-radius:15px;padding:14px;margin-top:12px}.dialog h2{margin:0 0 8px;font-size:18px}.dialog input{width:100%;padding:12px;background:#10172d;border:1px solid #777b9b;border-radius:10px;color:white;font:inherit}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.row button{flex:1}#status{font-size:13px;color:#b9c6db}footer{color:#b3b8c7;font-size:12px;margin:15px 0}#roster{font-size:12px;line-height:2.1;color:#b9c6db} @media(max-width:600px){.bubble{bottom:5px;padding:10px;font-size:14px}.bubble p{min-height:35px}.toolbar button{min-width:90px;font-size:14px;padding:9px}header small{font-size:11px}}</style></head><body><header><h1>🏮 灯街</h1><small id="clock">夕暮れ・1日目</small></header><main><div class="scene"><svg viewBox="0 0 960 640" role="img" aria-label="夕暮れの灯街。カフェや花屋、古書店が並ぶ通りに6人の住人が立っている。住人をタップすると会話できる。"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#5d477d"/><stop offset=".65" stop-color="#d98780"/><stop offset="1" stop-color="#f9bc89"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#56536d"/><stop offset="1" stop-color="#302e48"/></linearGradient></defs><rect width="960" height="640" fill="url(#sky)"/><circle cx="750" cy="105" r="55" fill="#ffdb9a" opacity=".85"/><path d="M0 285 Q130 210 250 275 T500 270 T760 275 T960 255 V440 H0" fill="#57516e"/><path d="M0 400 L220 290 H430 V520 H0Z" fill="#63586d"/><path d="M0 320 L210 260 L420 320" fill="#413c59"/><rect x="20" y="337" width="365" height="185" fill="#806f79"/><rect x="46" y="372" width="125" height="118" rx="8" fill="#4b5d70"/><rect x="190" y="372" width="156" height="118" rx="8" fill="#e5b37c"/><path d="M25 338 H380 L350 371 H55Z" fill="#bc697c"/><text x="220" y="356" font-size="23" text-anchor="middle" fill="#fff5e0">FLOWER & COFFEE</text><rect x="550" y="302" width="375" height="224" fill="#695e72"/><path d="M530 310 L730 240 L945 310Z" fill="#3d3d59"/><rect x="585" y="350" width="118" height="155" rx="5" fill="#3b4e65"/><rect x="736" y="350" width="140" height="155" rx="5" fill="#b39c79"/><text x="740" y="329" text-anchor="middle" fill="#ffe7b6" font-size="24">BOOKS & MUSIC</text><g fill="#ffedb0"><rect x="69" y="395" width="75" height="50"/><rect x="765" y="377" width="75" height="64"/></g><path d="M0 525 Q480 490 960 525 V640 H0" fill="url(#road)"/><path d="M0 568 Q480 530 960 568" fill="none" stroke="#e8d5aa" stroke-width="5" stroke-dasharray="38 32" opacity=".5"/><g><path d="M110 520 V275 M830 530 V265" stroke="#3d344c" stroke-width="9"/><path d="M110 275 Q110 245 140 245 M830 265 Q830 235 800 235" fill="none" stroke="#3d344c" stroke-width="9"/><circle cx="140" cy="246" r="20" fill="#ffe5a1"/><circle cx="800" cy="235" r="20" fill="#ffe5a1"/></g><g id="characters"></g><g opacity=".65" fill="#ffd7a1"><circle cx="465" cy="345" r="3"/><circle cx="480" cy="360" r="2"/><circle cx="520" cy="335" r="3"/></g></svg><div class="bubble"><strong id="speaker">灯街へようこそ</strong><p id="line">街にいる住人をタップしてみて。あなたの物語が始まるよ。</p></div></div><div class="toolbar"><button id="mic">🎙️ 話しかける</button><button id="speak">🔊 セリフを読む</button><button id="next">🌙 翌日へ</button><button id="mute">🔈 音声 ON</button></div><div class="dialog"><h2 id="name">会いたい住人を選ぼう</h2><p id="bio" class="hint">住人の姿をタップすると会話が始まるよ。</p><p id="bond"></p><input id="message" placeholder="ここに話したいことを入力（音声入力も可）" maxlength="160" aria-label="話しかける内容"><div class="row"><button id="send">💬 話す</button><button id="walk">🌸 一緒に散歩</button><button id="confess">💗 気持ちを伝える</button></div><p id="status">音声認識はブラウザ対応時のみ利用できます。初回はマイク許可が必要です。</p></div><details class="dialog"><summary>住人名簿（50人）</summary><p id="roster"></p></details><footer>体験版：住人の発話はルールベースで生成。音声読み上げ・音声認識は端末のブラウザ機能を使用します。音声認識はブラウザ提供元に送信される場合があります。ゲーム自体には外部API・広告・トラッキングはありません。共有世界・本物のAI自由会話は未実装。</footer></main><script>(()=>{'use strict';const names=['ミオ','レン','ユナ','カイ','アオイ','ハル','サラ','ソラ','ナギ','リク','エマ','トウマ','リン','シオン','ノア','レイ','コハル','ヒナ','セナ','イツキ','マコ','ツバサ','フウカ','ユウト','アキ','カナ','ヒカル','メイ','タクミ','リオ','ユイ','アサヒ','ミナト','スミレ','ルカ','ナオ','カエデ','ユズ','ハヤテ','マナ','チカ','シズク','コウ','アン','ナツ','トモ','ユキ','マリ','ジュン','アヤ'];const bios=['花屋の店員。笑顔の奥に秘密を隠している。','古書店の店主。静かだけど、一度心を開くと一途。','カフェの料理人。明るくて負けず嫌い。','音楽家。自由奔放で夜の街が好き。','図書館員。落ち着いていて観察力が鋭い。','街の案内人。誰とでも仲良くなるけれど寂しがり。'];const $=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem('akari-visual-v1'))}catch(e){}if(!s||!Array.isArray(s.bonds)||s.bonds.length!==50)s={day:1,selected:-1,bonds:Array(50).fill(0),muted:false};let current='街にいる住人をタップしてみて。あなたの物語が始まるよ。';const save=()=>{try{localStorage.setItem('akari-visual-v1',JSON.stringify(s))}catch(e){}};const palette=[['#a95069','#e2a5a9'],['#4e6186','#a9c7db'],['#b66f50','#ffd08c'],['#586c73','#93c3c5'],['#705b8c','#d5b9e4'],['#59816d','#a9d7ad']];const positions=[[140,490],[280,520],[410,490],[565,500],[710,480],[850,510]];const ns='http://www.w3.org/2000/svg';function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}function draw(){const g=$('characters');for(let i=0;i<6;i++){const [x,y]=positions[i],[coat,hair]=palette[i];const p=el('g',{class:'person',tabindex:'0',role:'button','aria-label':names[i]+'と話す',transform:'translate('+x+' '+y+')'},g);p.addEventListener('click',()=>select(i));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i)}});el('ellipse',{cx:0,cy:0,rx:37,ry:9,fill:'#24243c',opacity:'.4'},p);const b=el('g',{class:'body'},p);el('path',{d:'M-17 -60 L-14 -12 L-4 -12 L0 -43 L4 -12 L15 -12 L18 -60Z',fill:'#30324e'},b);el('path',{d:'M-28 -116 Q0 -136 28 -116 L33 -58 Q0 -42 -33 -58Z',fill:coat},b);el('path',{d:'M-27 -112 L-41 -69 L-30 -65 L-13 -99 M27 -112 L41 -69 L30 -65 L13 -99',fill:coat},b);el('rect',{x:-7,y:-138,width:14,height:24,rx:5,fill:'#f0c2a5'},b);el('ellipse',{cx:0,cy:-155,rx:26,ry:32,fill:hair},b);el('ellipse',{cx:0,cy:-148,rx:20,ry:25,fill:'#f1c5aa'},b);el('path',{d:'M-22 -162 Q-18 -191 6 -184 Q27 -179 22 -157 Q7 -169 -5 -164 Q-12 -156 -22 -162',fill:hair},b);el('circle',{cx:-7,cy:-148,r:2,fill:'#3b3245'},b);el('circle',{cx:8,cy:-148,r:2,fill:'#3b3245'},b);el('path',{d:'M-5 -137 Q0 -133 6 -137',fill:'none',stroke:'#ad6c6a','stroke-width':2},b);el('rect',{x:-31,y:-208,width:62,height:25,rx:12,fill:'#29283f',opacity:'.9'},p);const t=el('text',{x:0,y:-190,'text-anchor':'middle',fill:'#fff3df','font-size':15,'font-weight':'bold'},p);t.textContent=names[i];p.dataset.index=i}}function voice(t){if(s.muted||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.02;u.pitch=s.selected%2===0?1.13:.91;window.speechSynthesis.speak(u)}function say(t,auto=true){current=t;$('line').textContent=t;if(auto)voice(t)}function select(i){s.selected=i;save();document.querySelectorAll('.person').forEach((p,j)=>p.classList.toggle('active',j===i));$('speaker').textContent=names[i];$('name').textContent=names[i]+'と話す';$('bio').textContent=bios[i];$('bond').textContent='親密度 '+s.bonds[i]+'/10'+(s.bonds[i]>=6?' ♥ 心を許している':'');say(['あっ、会えてうれしい！','来てくれたんだね。少し話そう。','今日はどんなことがあった？'][ (s.day+i)%3 ])}function reply(input){if(s.selected<0){$('status').textContent='先に住人を選んでね。';return}const i=s.selected;let r;if(/好き|愛して|恋人|付き合/.test(input)){r=s.bonds[i]>=3?'そんなふうに言ってくれるなんて……うれしい。もっと一緒にいたいな。':'えっ、急に言われると照れちゃう。まずはもっとお互いを知りたいな。'}else if(/名前|誰/.test(input))r='私は'+names[i]+'。この街で暮らしているんだ。';else if(/元気|調子|こんにちは|おはよう|こんばんは/.test(input))r='うん、元気！あなたが来てくれて、もっと元気になったよ。';else if(/仕事|何して|趣味/.test(input))r=bios[i]+' でも、今日はあなたと話す時間が一番楽しみ。';else if(/秘密|他の人|嫉妬/.test(input))r='この街には、まだあなたが知らない関係がたくさんあるよ。';else r=['なるほど……そういう考え方、好きだな。もう少し聞かせて？','ふふ、あなたと話していると時間を忘れちゃう。','そうなんだ。私のことも少しずつ知ってほしいな。'][(s.day+i+s.bonds[i])%3];s.bonds[i]=Math.min(10,s.bonds[i]+1);save();$('bond').textContent='親密度 '+s.bonds[i]+'/10';$('speaker').textContent=names[i];say(r);$('status').textContent='あなた：「'+input.slice(0,60)+'」'}$('send').onclick=()=>{const t=$('message').value.trim();if(!t)return;reply(t);$('message').value=''};$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('walk').onclick=()=>{if(s.selected<0)return;const i=s.selected;s.bonds[i]=Math.min(10,s.bonds[i]+2);save();select(i);say('この通り、夕方が一番きれいなんだ。今日は一緒に歩いてくれてありがとう。')};$('confess').onclick=()=>reply('好きです。付き合ってください');$('next').onclick=()=>{s.day++;save();$('clock').textContent='夕暮れ・'+s.day+'日目';say(names[(s.day*7)%50]+'と'+names[(s.day*13+5)%50]+'が広場で話していたらしい。');$('speaker').textContent='街のうわさ'};$('mute').onclick=()=>{s.muted=!s.muted;save();$('mute').textContent=s.muted?'🔇 音声 OFF':'🔈 音声 ON';if(s.muted&&window.speechSynthesis)window.speechSynthesis.cancel()};$('speak').onclick=()=>{if('speechSynthesis'in window){const v=s.muted;s.muted=false;voice(current);s.muted=v}else $('status').textContent='このブラウザでは読み上げを利用できません。'};$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='このブラウザは音声認識に対応していないようです。入力欄のキーボードマイクを試してね。';return}const r=new R();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{$('message').value=e.results[0][0].transcript;$('send').click()};r.onerror=e=>$('status').textContent='音声認識：'+e.error+'。マイクの許可やブラウザ対応を確認してね。';r.onstart=()=>$('status').textContent='聞いているよ……話してね。';r.onend=()=>{if($('status').textContent==='聞いているよ……話してね。')$('status').textContent='音声入力が終了しました。'};try{r.start()}catch(e){$('status').textContent='音声認識を開始できませんでした。'}};$('roster').textContent=names.join('・');$('clock').textContent='夕暮れ・'+s.day+'日目';$('mute').textContent=s.muted?'🔇 音声 OFF':'🔈 音声 ON';draw();if(s.selected>=0&&s.selected<6)select(s.selected)})();</script></body></html>
