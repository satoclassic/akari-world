<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'"><title>灯街｜体験版</title><style>*{box-sizing:border-box}body{margin:0;background:#101321;color:#f5eede;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}h1{font-size:2rem;color:#ffdb9c}h2{font-size:1.2rem}p{margin:.6em 0}.muted{color:#b7b5c6}.panel{background:#202438;border:1px solid #4c4b65;border-radius:16px;padding:18px;margin:16px 0}button{border:1px solid #a88b7c;background:#393149;color:#fff;border-radius:12px;padding:12px 15px;margin:5px;cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #ffce75}button:hover{background:#51415d}.accent{background:#755064}#log{white-space:pre-wrap;min-height:70px}small{color:#b7b5c6}#people{display:flex;flex-wrap:wrap}#people button{min-width:110px}.stat{color:#ffca80}footer{margin-top:30px;color:#aaa;font-size:12px}</style></head><body><main><h1>🏮 灯街 <small>AKARI WORLD</small></h1><p>この街の人間関係は、あなたがいない間にも少しずつ変わっていく。</p><div class="panel"><p id="day"></p><p id="news"></p><button id="next" class="accent">翌日へ進む</button><button id="reset">最初から</button></div><div class="panel"><h2>住人と出会う</h2><p class="muted">最初に会う相手はあなたが選べるよ。</p><div id="people"></div></div><div class="panel"><h2 id="who">住人を選んでね</h2><p id="bio"></p><p id="bond" class="stat"></p><div id="actions"></div><p id="log" aria-live="polite"></p></div><div class="panel"><h2>街の住人名簿</h2><p id="roster"></p></div><footer>非公開試作・体験版。会話はシナリオ方式。外部送信なし。保存データはこのブラウザ内だけ。AI自由会話・ユーザー間同期は未実装。</footer></main><script>(()=>{'use strict';const names=['ミオ','レン','ユナ','カイ','アオイ','ハル','サラ','ソラ','ナギ','リク','エマ','トウマ','リン','シオン','ノア','レイ','コハル','ヒナ','セナ','イツキ','マコ','ツバサ','フウカ','ユウト','アキ','カナ','ヒカル','メイ','タクミ','リオ','ユイ','アサヒ','ミナト','スミレ','ルカ','ナオ','カエデ','ユズ','ハヤテ','マナ','チカ','シズク','コウ','アン','ナツ','トモ','ユキ','マリ','ジュン','アヤ'];const bios=['花屋で働く。人懐っこいけれど、秘密を一つ抱えている。','古書店の店主。慎重で、心を開くと情熱的。','カフェの料理人。明るく、負けず嫌い。','音楽家。自由奔放で夜の街が好き。','図書館員。静かで観察力が鋭い。','街の案内人。誰とでも仲良くなるが、少し寂しがり。'];const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem('akari-save-v1')||'null')}catch(e){}if(!state||!Number.isInteger(state.day)||!Array.isArray(state.bonds)||state.bonds.length!==50)state={day:1,selected:-1,bonds:Array(50).fill(0),events:[]};const save=()=>{try{localStorage.setItem('akari-save-v1',JSON.stringify(state))}catch(e){}};function render(){ $('day').textContent='街の暦：'+state.day+'日目';$('news').textContent=state.events.at(-1)||'街は静かな朝を迎えた。';$('people').replaceChildren();for(let i=0;i<6;i++){const b=document.createElement('button');b.textContent=names[i];b.addEventListener('click',()=>{state.selected=i;save();render()});$('people').append(b)}const i=state.selected;if(i<0||i>=50){$('who').textContent='住人を選んでね';$('bio').textContent='';$('bond').textContent='';$('actions').replaceChildren();return}$('who').textContent=names[i];$('bio').textContent=bios[i%6];$('bond').textContent='親密度：'+state.bonds[i]+' / 10'+(state.bonds[i]>=7?' ♥ 特別な関係':'');$('actions').replaceChildren();for(const [label,inc,lines] of [['話しかける',1,['「会えてうれしい。今日はどんな日だった？」','「あなたのこと、もっと知りたいな」','「この街、少しずつ変わってきた気がする」']],['一緒に散歩する',2,['「この路地、好きなんだ。内緒だよ」','「一緒にいると時間が早いね」']],['気持ちを伝える',0,['「急に言われると照れるよ。でも、うれしい」','「もう少し一緒にいたいな」']]]){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{if(label==='気持ちを伝える'&&state.bonds[i]<3){$('log').textContent='まだ少し早いかも。まずは仲良くなろう。';return}state.bonds[i]=Math.min(10,state.bonds[i]+inc);$('log').textContent=names[i]+'：'+lines[(state.day+i+state.bonds[i])%lines.length];save();render()});$('actions').append(b)}$('roster').textContent=names.map((n,j)=>n+(j<6?' ★':'')).join('・')} $('next').addEventListener('click',()=>{state.day++;const a=(state.day*7)%50,b=(state.day*13+5)%50;state.events.push(names[a]+'と'+names[b]+'が街の広場で話していたらしい。');state.events=state.events.slice(-12);save();render()});$('reset').addEventListener('click',()=>{if(confirm('このブラウザの進行状況を消して最初から始める？')){localStorage.removeItem('akari-save-v1');location.reload()}});render()})();</script></body></html>
