<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241e26"><title>灯街｜カフェ会話試作</title><style>*{box-sizing:border-box}body{margin:0;background:#17151d;color:#fff4e9;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.app{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:#26212b}header{padding:12px 18px;display:flex;justify-content:space-between;align-items:center}header b{color:#ffd49c}small{color:#bcb4bb}.portrait{height:min(56dvh,590px);min-height:330px;position:relative;overflow:hidden;background:linear-gradient(115deg,#695346,#b89474 40%,#594b47)}.window{position:absolute;right:0;top:0;width:31%;height:80%;background:linear-gradient(120deg,#d9ddd2,#a2b5a8);border-left:13px solid #e6d6c5;box-shadow:-30px 0 65px #ffe3ac55}.shelf{position:absolute;left:0;top:10%;width:52%;height:28%;border-bottom:15px solid #5c4036;background:repeating-linear-gradient(90deg,#665246 0 16px,#8c7058 17px 30px,#4b3a35 31px 41px)}.table{position:absolute;bottom:-5%;width:120%;height:19%;left:-10%;background:#7b5243;border-radius:50% 50% 0 0;box-shadow:0 -10px 18px #3b2a2677}.person{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(78%,370px);height:82%;filter:drop-shadow(0 12px 14px #35201e55)}.hair{position:absolute;left:15%;top:3%;width:70%;height:75%;border-radius:47% 47% 30% 30%;background:linear-gradient(90deg,#1f1a20,#403037 40%,#1d1920 85%)}.shoulders{position:absolute;bottom:0;width:100%;height:43%;background:linear-gradient(100deg,#c8b9a8,#eee0d2 48%,#b7a393);border-radius:48% 48% 10% 10%}.shirt{position:absolute;bottom:0;left:36%;width:28%;height:36%;background:#eee9df;clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}.neck{position:absolute;left:42%;top:50%;width:16%;height:19%;border-radius:35%;background:#e2b59c}.face{position:absolute;left:27%;top:13%;width:46%;height:48%;border-radius:43% 43% 48% 48%;background:linear-gradient(105deg,#d7a68e,#f1c7ad 55%,#ddb096);box-shadow:inset -9px -10px 15px #ad796144}.fringe{position:absolute;left:25%;top:8%;width:52%;height:25%;border-radius:55% 50% 15% 15%;background:#241e25;transform:rotate(-5deg)}.eye{position:absolute;top:49%;width:10%;height:2%;border-radius:50%;background:#342b2c}.eye.l{left:21%}.eye.r{right:21%}.nose{position:absolute;top:62%;left:49%;width:4%;height:8%;border-right:2px solid #c18e7c;border-radius:40%}.mouth{position:absolute;top:78%;left:39%;width:22%;height:5%;border-bottom:3px solid #a9686d;border-radius:0 0 50% 50%;transition:all .12s}.talking .mouth{height:11%;border:0;background:#9c5c63;border-radius:45%}.cheek{position:absolute;top:66%;width:16%;height:7%;border-radius:50%;background:#d58d8b55}.cheek.l{left:8%}.cheek.r{right:8%}.name{position:absolute;top:12px;left:14px;background:#19151bb8;border-radius:12px;padding:8px 12px}.subtitle{position:absolute;bottom:10px;left:4%;width:92%;text-align:center;background:#17151dcc;padding:10px 14px;border-radius:12px;min-height:52px;font-size:16px}.controls{padding:14px;display:grid;gap:10px}.actions{display:flex;gap:8px}.actions button{flex:1}button{border:1px solid #8b7183;background:#5c445b;color:white;border-radius:14px;padding:13px 12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #ffcb8d}button.primary{background:#b36b79}input{min-width:0;flex:1;border:1px solid #887887;background:#181720;border-radius:12px;padding:13px;color:white;font:inherit}.status{font-size:13px;color:#cbbec6;min-height:20px}.history{font-size:13px;color:#cfc4cc;max-height:100px;overflow:auto;white-space:pre-wrap}footer{font-size:11px;color:#afa5b0;padding:0 14px 16px}a{color:#f4c29e}</style></head><body><main class="app"><header><b>🏮 灯街・カフェ会話試作</b><small>ミオとの出会い</small></header><section class="portrait" aria-label="カフェで微笑む女性のイラスト"><div class="window"></div><div class="shelf"></div><div class="person" id="person"><div class="hair"></div><div class="shoulders"></div><div class="shirt"></div><div class="neck"></div><div class="face"><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div><div class="cheek l"></div><div class="cheek r"></div></div><div class="fringe"></div></div><div class="table"></div><div class="name">ミオ｜カフェで働いている</div><div class="subtitle" id="subtitle">「こんにちは！ よかったら、少しお話ししない？」</div></section><section class="controls"><div class="actions"><button class="primary" id="mic">🎙️ 声で話す</button><button id="voice">🔊 声 ON</button><button id="reset">↺ 記憶リセット</button></div><div class="actions"><input id="input" maxlength="180" placeholder="ミオに話しかける" aria-label="ミオへのメッセージ"><button id="send">送信</button></div><div class="status" id="status">声で話すにはマイクの許可が必要。文字でも会話できるよ。</div><div class="history" id="history"></div></section><footer>これは会話体験の試作です。人物は簡易イラスト、返答はルールベースで、生成AIではありません。会話の記憶はこの端末内に保存されます。ブラウザ音声認識は端末・ブラウザにより利用不可の場合があり、音声がサービス提供元に送信される場合があります。<a href="./">3D街版へ戻る</a></footer></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem('akari-cafe-v1'))}catch(e){}if(!state||!Array.isArray(state.memory))state={memory:[],name:'',voice:true,turn:0};const save=()=>{try{localStorage.setItem('akari-cafe-v1',JSON.stringify(state))}catch(e){}};let utter=null;function say(t){$('subtitle').textContent='「'+t+'」';$('history').textContent+='ミオ：'+t+'\n';$('history').scrollTop=$('history').scrollHeight;if(!state.voice||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.03;u.pitch=1.12;u.onstart=()=>{$('person').classList.add('talking')};u.onend=u.onerror=()=>{$('person').classList.remove('talking')};utter=u;window.speechSynthesis.speak(u)}function answer(t){$('history').textContent+='あなた：'+t+'\n';let r;if(/私の名前は|僕の名前は|俺の名前は|名前は/.test(t)){const m=t.match(/(?:私の|僕の|俺の)?名前は(.+?)(?:です|だよ|だ|。|！|!|$)/);if(m){state.name=m[1].trim().slice(0,15)}r=state.name?'そうなんだ、'+state.name+'さん！ 覚えたよ。よろしくね。':'名前を教えてくれるとうれしいな。'}else if(/名前覚えて|私の名前|僕の名前|俺の名前/.test(t))r=state.name?'もちろん、'+state.name+'さんでしょ？':'まだ名前を聞いていないみたい。教えて？';else if(/覚えて|昨日|前に/.test(t))r=state.memory.length?'前に「'+state.memory[state.memory.length-1].slice(0,36)+'」って話してくれたよね。':'これから一緒に思い出を作ろうね。';else if(/好き|付き合|恋人/.test(t))r='えっ……そんなこと言われると照れちゃう。でも、もっとあなたと話してみたいな。';else if(/何して|仕事|カフェ/.test(t))r='このカフェで働いてるの。常連さんとのおしゃべりが好きなんだ。';else if(/元気|こんにちは|こんばんは|おはよう/.test(t))r='うん、元気だよ！ あなたは今日はどんな一日だった？';else if(/趣味|休日/.test(t))r='休日は古い喫茶店を巡るのが好き。あなたは何が好き？';else if(/ありがとう/.test(t))r='こちらこそ、ありがとう。そう言ってもらえるとうれしいな。';else r=['そうなんだ。もう少し詳しく聞いてもいい？','ふふ、なんだかあなたと話すと落ち着くな。','それって素敵だね。私にももっと教えて？','へえ、そういうこともあるんだね。'][state.turn%4];state.turn++;state.memory.push(t);state.memory=state.memory.slice(-20);save();say(r)}$('send').onclick=()=>{const t=$('input').value.trim();if(!t)return;$('input').value='';answer(t)};$('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('voice').onclick=()=>{state.voice=!state.voice;save();$('voice').textContent=state.voice?'🔊 声 ON':'🔇 声 OFF';if(!state.voice&&window.speechSynthesis)window.speechSynthesis.cancel()};$('reset').onclick=()=>{if(!confirm('ミオとの会話の記憶を消す？'))return;localStorage.removeItem('akari-cafe-v1');location.reload()};$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='このブラウザは音声認識に対応していません。iPhoneならキーボードのマイクで入力できる場合があります。';return}const r=new R();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>$('status').textContent='聞いているよ……話してね';r.onresult=e=>{const t=e.results[0][0].transcript;$('status').textContent='聞き取った言葉：'+t;answer(t)};r.onerror=e=>$('status').textContent='音声入力エラー：'+e.error;r.start()};$('voice').textContent=state.voice?'🔊 声 ON':'🔇 声 OFF';$('history').textContent=state.memory.length?'前回までに'+state.memory.length+'件の発言を記憶しています。\n':''})();</script></body></html>
